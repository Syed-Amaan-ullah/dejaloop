[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dejaloop"
version = "0.1.0"
description = "Live brake for coding agents: detects Claude Code sessions going in circles and intervenes before tokens burn. Fully local, free built-in judge, optional Jev upgrade."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["claude-code", "agent", "loop-detection", "jev", "typesafe", "cost"]
authors = [{ name = "TBD" }]

[project.scripts]
dejaloop = "dejaloop.cli:main"

[project.urls]
Homepage = "https://github.com/TBD/dejaloop"

[tool.setuptools]
packages = ["dejaloop"]
